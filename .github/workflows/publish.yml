name: Publish validated image to GHCR
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate project and installer
        run: python3 -m unittest discover -s tests -v

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="0.7.2-cf${version}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "local=centralflow-under-test:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build full upstream application with extension
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.local }}
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Start image with disposable PostgreSQL and Redis
        env:
          TEST_IMAGE: ${{ steps.image.outputs.local }}
        run: bash scripts/smoke.sh

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the already validated image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Exact EasyPanel image reference
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo '## Image published after full build and startup smoke test'
            echo 'In EasyPanel choose Source > Docker Image. Do not choose Dockerfile.'
            echo "Version tag: \`$IMAGE_NAME:$IMAGE_TAG\`"
            echo "Pinned digest (recommended): \`$IMAGE_NAME@$IMAGE_DIGEST\`"
            echo 'A newly created GHCR package may be private. Set package visibility to public for anonymous pulls.'
          } >> "$GITHUB_STEP_SUMMARY"

