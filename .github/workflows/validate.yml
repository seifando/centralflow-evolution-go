name: Validate source and Docker image
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate project and installer
        run: python3 -m unittest discover -s tests -v

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="0.7.2-cf${version}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "local=centralflow-under-test:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build full upstream application with extension
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.local }}
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Start image with disposable PostgreSQL and Redis
        env:
          TEST_IMAGE: ${{ steps.image.outputs.local }}
        run: bash scripts/smoke.sh

